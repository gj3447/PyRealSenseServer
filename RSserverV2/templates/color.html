<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealSense - Color Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-gray-800">Color Stream</h1>
                <a href="/" class="text-blue-500 hover:text-blue-600">← 메인으로 돌아가기</a>
            </div>
        </header>

        <div class="bg-white rounded-lg shadow-lg p-6">
            <!-- 스트림 뷰어 -->
            <div class="aspect-video bg-gray-200 rounded-lg mb-6">
                <img id="colorStream" src="/api/camera/stream" alt="Color Stream" class="w-full h-full object-contain">
            </div>

            <!-- 컨트롤 패널 -->
            <div class="flex justify-between items-center">
                <div class="text-gray-600">
                    해상도: <span id="resolution">{{ width }}x{{ height }}</span> | 
                    FPS: <span id="fps">{{ fps }}</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
